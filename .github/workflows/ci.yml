name: Project CI

on:
  push:
    branches:
      - main
      - feat/complete-platform-hardening-2026-10-25
      - feat/owner-agent-requests-subscription-access
  pull_request:
    branches:
      - main
      - feat/complete-platform-hardening-2026-10-25

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amlak_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build production backend runtime image
        run: docker build --target runtime -f Dockerfile.production -t hashti-backend:ci .
      - name: Build production migration image
        run: docker build --target migration -f Dockerfile.production -t hashti-backend-migrate:ci .
      - name: Run production backend startup smoke test
        run: |
          docker run -d --name hashti-backend-smoke \
            -e PORT=4000 \
            -e DATABASE_URL=postgresql://postgres:smoke-test@127.0.0.1:5432/amlak \
            -e CORS_ORIGINS=http://localhost:3000 \
            -p 4000:4000 \
            hashti-backend:ci
          trap 'docker rm -f hashti-backend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --output /dev/null http://127.0.0.1:4000/; then
              echo "Production backend process started and accepted an HTTP request."
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' hashti-backend-smoke)" != "true" ]; then
              docker logs hashti-backend-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs hashti-backend-smoke
          echo "Production backend did not become reachable within 20 seconds."
          exit 1
      - name: Type-check backend
        run: npx tsc --noEmit

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint frontend
        id: lint
        run: npm run lint
      - name: Build static frontend
        if: success() || steps.lint.outcome == 'failure'
        run: npm run build
