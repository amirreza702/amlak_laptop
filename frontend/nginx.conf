server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # تمام شناسه‌های ملک، از جمله شناسه‌هایی که پس از Build ثبت می‌شوند،
    # به فایل استاتیک مشترک هدایت می‌شوند؛ URL مرورگر عوض نمی‌شود.
    location = /property {
        return 301 /property/;
    }

    location = /property/ {
        try_files /property/__csr__.html =404;
    }

    location ^~ /property/ {
        try_files $uri $uri.html /property/__csr__.html;
    }

    # درخواست‌های API از همان مبدأ عبور می‌کنند تا CORS مرورگر مطرح نشود.
    # Nginx مسیر /api/ را به مسیر اصلی Express در سرویس backend تبدیل می‌کند.
    location ^~ /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
