services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-amlak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    init: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.static
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: hashti_postgres_data_prod
